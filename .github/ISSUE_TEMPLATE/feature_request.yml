name: "💡 Sugerencia"
description: "Idea para una nueva función o mejora"
title: "[Idea]: "
labels: [ "enhancement" ]
body:
    -   type: checkboxes
        id: preflight
        attributes:
            label: Antes de enviar
            options:
                -   label: He buscado entre los issues abiertos y no he encontrado una sugerencia parecida
                    required: true

    -   type: dropdown
        id: surface
        attributes:
            label: Dónde se necesita
            options:
                - Android TV
                - Interfaz móvil
                - Ambas
        validations:
            required: true

    -   type: textarea
        id: problem
        attributes:
            label: Qué problema resuelve
            description: Qué resulta incómodo ahora o qué falta
        validations:
            required: true

    -   type: textarea
        id: solution
        attributes:
            label: Cómo debería funcionar
        validations:
            required: true

    -   type: textarea
        id: alternatives
        attributes:
            label: Alternativas
            description: Cómo lo solucionas ahora y qué otras opciones has considerado

    -   type: textarea
        id: extra
        attributes:
            label: Capturas y ejemplos
            description: Por ejemplo, cómo se hace en otras apps
