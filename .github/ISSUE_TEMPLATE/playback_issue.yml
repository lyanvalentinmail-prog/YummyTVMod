name: "▶️ El vídeo no se reproduce / problema con el balanceador"
description: "Error de reproducción, carga infinita, pantalla negra, sin voz o sin calidad"
title: "[Vídeo]: "
labels: [ "bug" ]
body:
    -   type: markdown
        attributes:
            value: |
                YummyTV depende de la disponibilidad de YummyAnime y de balanceadores de vídeo de terceros.
                Si el sitio, la API o una fuente no están disponibles temporalmente, la reproducción puede fallar.
                Fuera de la CEI, algunos balanceadores se bloquean por dirección IP.

    -   type: input
        id: version
        attributes:
            label: Versión de la app
            placeholder: "1.23"
        validations:
            required: true

    -   type: dropdown
        id: surface
        attributes:
            label: Interfaz
            options:
                - Android TV / TV Box
                - Móvil / tableta
                - Ambas
        validations:
            required: true

    -   type: input
        id: device
        attributes:
            label: Dispositivo y versión de Android
            placeholder: "Xiaomi Mi Box S, Android 9"
        validations:
            required: true

    -   type: input
        id: title-episode
        attributes:
            label: Título y episodio
            placeholder: "Naruto, episodio 12"
        validations:
            required: true

    -   type: input
        id: dubbing
        attributes:
            label: Voz
            placeholder: "AniLibria"

    -   type: dropdown
        id: balancer
        attributes:
            label: Balanceador
            multiple: true
            options:
                - Kodik
                - Aksor
                - Alloha
                - CVH
                - VK
                - Rutube
                - Sibnet
                - Zedfilm
                - No lo sé / todos a la vez
        validations:
            required: true

    -   type: dropdown
        id: works-on-site
        attributes:
            label: ¿Se reproduce este episodio en yummyani.me desde el navegador?
            options:
                - Sí
                - No
                - No lo he comprobado
        validations:
            required: true

    -   type: input
        id: region
        attributes:
            label: País / región
            placeholder: "España"

    -   type: dropdown
        id: vpn
        attributes:
            label: VPN
            options:
                - Sin VPN
                - Con VPN

    -   type: textarea
        id: what-happens
        attributes:
            label: Qué se ve en pantalla
            description: Texto del error, carga infinita, pantalla negra, sonido sin imagen, etc.
        validations:
            required: true

    -   type: textarea
        id: extra
        attributes:
            label: Registros, capturas, vídeos
            description: Puedes arrastrar los archivos directamente a este campo
