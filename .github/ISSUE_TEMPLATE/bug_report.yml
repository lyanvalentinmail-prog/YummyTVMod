name: "🐞 Error en la app"
description: "Algo no funciona como se esperaba"
title: "[Error]: "
labels: [ "bug" ]
body:
    -   type: checkboxes
        id: preflight
        attributes:
            label: Antes de enviar
            options:
                -   label: He comprobado que el error se reproduce en la última versión de Releases
                    required: true
                -   label: He buscado entre los issues abiertos y no he encontrado el mismo problema
                    required: true

    -   type: input
        id: version
        attributes:
            label: Versión de la app
            description: Aparece en los ajustes de la app y en el nombre del APK
            placeholder: "1.23"
        validations:
            required: true

    -   type: dropdown
        id: surface
        attributes:
            label: Interfaz
            options:
                - Android TV / TV Box
                - Móvil / tableta
                - Ambas
        validations:
            required: true

    -   type: input
        id: device
        attributes:
            label: Dispositivo y versión de Android
            placeholder: "Xiaomi Mi Box S, Android 9"
        validations:
            required: true

    -   type: textarea
        id: what-happens
        attributes:
            label: Qué ocurre
            description: Describe el problema en una o dos frases
        validations:
            required: true

    -   type: textarea
        id: steps
        attributes:
            label: Pasos para reproducirlo
            placeholder: |
                1. Abrir ...
                2. Pulsar ...
                3. Ver ...
        validations:
            required: true

    -   type: textarea
        id: expected
        attributes:
            label: Comportamiento esperado
            description: Cómo crees que debería funcionar

    -   type: textarea
        id: extra
        attributes:
            label: Registros, capturas, vídeos
            description: Puedes arrastrar los archivos directamente a este campo
